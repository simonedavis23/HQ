<title>My Life</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Marcellus&family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f7f1e5;--card:#fdf9f1;--ink:#3a2d27;--mut:#66534a;--line:#e6dbc5;--warn:#a93a25;--soft:#f3eadb;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 14px 60px}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:28px}#ttl{font-family:'Playfair Display',Georgia,'Times New Roman',serif!important;font-weight:600!important;letter-spacing:.015em}body.home #ttl{font-size:29px!important}body:not(.home) main{padding-top:10px}body:not(.home) h1{font-size:22px!important;line-height:1.15}body:not(.home) .sub{font-size:12.5px;margin:0 0 4px}body:not(.home) nav.hasback{padding:6px 0 8px;margin-top:0}
.sub{color:var(--mut);margin:2px 0 14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
nav button{flex:none;border:1.5px solid var(--tc);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:600 14px Figtree,sans-serif;cursor:pointer}
nav.hasback{position:sticky;top:0;z-index:6;background:var(--bg);align-items:center;padding:8px 0 10px;margin-top:-4px}input.sidein{width:auto;display:inline-block;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:9px;padding:9px 14px;font:600 14px Figtree,sans-serif;text-align:center;min-height:0;margin:0}input.sidein.sel{background:color-mix(in srgb,var(--tc) 38%,#fdf9f1);color:#43342d;border:1px solid color-mix(in srgb,var(--tc) 55%,#fdf9f1)}input.sidein::placeholder{color:var(--mut);opacity:1}.gp{position:relative}.gmore{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mut);font:700 20px/1 Figtree,sans-serif;cursor:pointer;padding:0}.gtools{background:var(--soft);border-radius:12px;padding:12px;margin:0 0 12px}.strow>summary{list-style:none;cursor:pointer}.strow>summary::-webkit-details-marker{display:none}.strow{border-bottom:1px solid var(--line)}.strow>summary.row{border-bottom:0}nav .back{background:#5b4439;color:#fbf3e6;border:0;padding:6px 14px;font:700 13.5px Figtree,sans-serif;box-shadow:0 2px 6px rgba(70,45,35,.25)}nav .bk{color:var(--mut);font-size:14px;white-space:nowrap}.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px;margin:0 0 10px;width:fit-content}.seg button{border:0;background:transparent;color:var(--ink);padding:7px 16px;border-radius:999px;font:600 14px Figtree,sans-serif;cursor:pointer}.seg button.on{background:var(--tc);color:#43342d}
nav button.on{background:color-mix(in srgb,var(--tc) 38%,#fdf9f1);color:#43342d;border:1px solid color-mix(in srgb,var(--tc) 55%,#fdf9f1)}
:focus-visible{outline:3px solid var(--tc,#2f6b5e);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel h2{font-size:19px;color:var(--tt,var(--tc));margin-bottom:8px}
h3{font-size:14px;color:var(--mut);margin:14px 0 4px;font-weight:600}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
form .first{grid-column:1/-1}
input,select,textarea{width:100%;resize:vertical;font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--ink);min-width:0}
.btn{font:600 14px Figtree,sans-serif;border:0;border-radius:9px;padding:9px 14px;background:color-mix(in srgb,var(--tc) 38%,#fdf9f1);color:#43342d;border:1px solid color-mix(in srgb,var(--tc) 55%,#fdf9f1);cursor:pointer}
.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .m{color:var(--mut);font-size:13px}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--tt,var(--tc));flex:none}
.done .t{text-decoration:line-through;color:var(--mut)}
.late{color:var(--warn)!important;font-weight:600}
.x{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:2px 8px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:17px;cursor:pointer}
.tag{font-size:12px;font-weight:600;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:1px 6px}
.empty{color:var(--mut);padding:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rl{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.rl:last-of-type{border:0}.rl b{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:2px}.rl span{display:block}.rl .ok{font-weight:600}.rl .no{font-weight:600}.rl .m{font-size:12px;font-weight:400}.rl.pot{opacity:.75}.cin input::-webkit-outer-spin-button,.cin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.cin input{-moz-appearance:textfield}.cin{display:flex;align-items:center;gap:2px;font-weight:700}.cin input{width:90px;text-align:right;font-weight:700;font-size:13px;padding:3px 6px;border-radius:8px}.trip.rw{padding:6px 12px}.rl{padding:4px 0!important;font-size:13px}.addf.sm{margin:0 0 6px}.addf.sm>summary{padding:4px 12px;font-size:13px}.cashf{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}.trip .trow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:1px 0;font-size:13px;border:0}.trip.rw{font-size:13px}.bn{border:0!important;background:transparent!important;padding:2px 0!important;font:inherit;width:100%}.strow.bdg{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:10px}.trow b{font-weight:600}
.trip{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}.todayc h3{margin:0 0 6px}.trow{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}.trow:last-child{border-bottom:0}.trow>.m{min-width:64px}.trow.col{flex-direction:column;gap:4px;align-items:stretch}.tk{display:flex;gap:8px;align-items:center}.tk input{width:20px;height:20px;accent-color:var(--tt,var(--tc))}
.rth{width:40px;height:40px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:10px}.rec[open]{background:color-mix(in srgb,var(--tc) 15%,var(--card));border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 8px rgba(60,40,30,.08)}.rec[open]>summary{color:var(--tt,var(--tc))}.rec[open] input:not([type=checkbox]):not([type=file]),.rec[open] select,.rec[open] textarea{background:var(--card)}
.rs{display:flex;align-items:center;gap:4px}.rs::before{content:'▸';color:var(--mut);margin-right:6px}.rec[open]>.rs::before{content:'▾'}.rs .rt{flex:1;min-width:0}.rs .pen{flex:none}
.pen{border:0;background:transparent;font-size:22px;color:var(--mut);padding:2px 8px;cursor:pointer;line-height:1}.rtop{display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px}
.rflag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--a);color:#fff;margin-left:6px;vertical-align:middle}.ringl{margin:0;padding-left:18px}.ringl li{margin:0 0 2px;break-inside:avoid}.rsvb{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12px;opacity:.9}.rsvb b{font-size:13px;min-width:16px;text-align:center}.rsvb .btn{padding:0;width:26px;height:26px;min-height:0;font-size:15px;line-height:1;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}.rbtns .btn{padding:7px 12px;font-size:13px}.stg{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:1;color:inherit;margin:18px 0 6px}
.stw .m{color:inherit;opacity:.8}
.stw .stsch{font-size:14px;font-weight:500}
.chip{font-size:12px!important}
.chip.maybe{color:#b8860b!important;background:rgba(184,134,11,.12)}
.chip.no{color:inherit!important;opacity:.6}
.stmore{margin-top:4px;font-weight:600}
.stdlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}

// ---------- does a person fit a study ----------
const bmiOf = (p) => (p && +p.ht > 0 && +p.wt > 0) ? 703 * +p.wt / (+p.ht * +p.ht) : null;
function evalPerson(p, crit) {
  const no = [], maybe = [], notes = [], c = crit || null;
  if (!c) return { s: 'maybe', why: ['Details not read yet'], notes };
  const bmi = bmiOf(p), f1 = (n) => (Math.round(n * 10) / 10).toFixed(1);
  if (c.special && p.healthy !== false) no.push('Needs a specific condition or group (' + c.special + ')');
  if (c.ow && bmi != null && bmi < 25) no.push('Overweight study (BMI ' + f1(bmi) + ')');
  if (c.sex === 'M' && p.sex === 'F') no.push('Men only');
  if (c.sex === 'F' && p.sex === 'M') no.push('Women only');
  if (c.age && +p.age) { const lo = c.age[0], hi = c.age[1]; if ((lo != null && p.age < lo) || (hi != null && p.age > hi)) no.push('Age ' + p.age + ' is outside ' + lo + (hi != null ? '–' + hi : '+')); }
  else if (!c.age) maybe.push('Age not listed');
  if (c.bmi && bmi != null) { const lo = c.bmi[0], hi = c.bmi[1]; if (lo != null && bmi < lo) no.push('BMI ' + f1(bmi) + ' is under ' + lo); else if (hi != null && bmi > hi) no.push('BMI ' + f1(bmi) + ' is over ' + hi); }
  else if (!c.bmi && !(c.ow && bmi != null && bmi >= 25)) maybe.push('BMI not listed' + (c.ow ? ' (overweight study)' : ''));
  if (c.minWt && +p.wt && p.wt < c.minWt) no.push('Weight is under ' + c.minWt + ' lb');
  if (c.smoker === 'non' && p.smoker) no.push('Non-smokers only');
  if (c.smoker === 'only' && !p.smoker) no.push('Smokers only');
  if (c.ncb) {
    if (p.sex === 'F' && p.cbp) no.push('Needs non-childbearing potential');
    else if (p.sex === 'M' && !p.vas) maybe.push('Check the birth-control rule for men');
  }
  if (c.vas && p.sex === 'M' && !p.vas) { if (c.vas === 'req') no.push('Needs a vasectomy'); else maybe.push('Mentions vasectomy, check the rule'); }
  if (c.meds) notes.push('No prescription medications allowed');
  if (no.length) return { s: 'no', why: no, notes };
  if (maybe.length) return { s: 'maybe', why: maybe, notes };
  return { s: 'ok', why: [c.ow && !c.bmi ? 'Overweight study' : 'Fits the age and BMI listed'], notes };
}

const stTz = (d, tz) => { const f = new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', hour12: false }); const o = {}; f.formatToParts(d).forEach(p => o[p.type] = p.value); return { dow: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(o.weekday), y: +o.year, mo: +o.month, d: +o.day, h: (+o.hour) % 24, mi: +o.minute }; };
const stZoned = (y, mo, d, h, mi, tz) => { let g = Date.UTC(y, mo - 1, d, h, mi); for (let k = 0; k < 2; k++) { const p = stTz(new Date(g), tz); g -= Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi) - Date.UTC(y, mo - 1, d, h, mi); } return new Date(g); };
const stMin = (t) => +t.slice(0, 2) * 60 + +t.slice(3, 5);
const stClock = (d, tz) => d.toLocaleTimeString('en-US', { timeZone: tz || 'America/Chicago', hour: 'numeric', minute: '2-digit' });
// Returns { open, closesAt: Date|null, nextOpen: Date|null }
function openInfo(hours, now) {
  now = now || new Date();
  const tz = (hours && hours.tz) || 'America/Chicago';
  const day = (dow) => hours && hours.d ? hours.d[String(dow)] : (dow >= 1 && dow <= 5 ? ['08:00', '17:00'] : null);
  const p = stTz(now, tz), cur = p.h * 60 + p.mi, t = day(p.dow);
  if (t && cur >= stMin(t[0]) && cur < stMin(t[1])) return { open: true, closesAt: stZoned(p.y, p.mo, p.d, +t[1].slice(0, 2), +t[1].slice(3, 5), tz), nextOpen: null };
  for (let k = 0; k < 8; k++) {
    const base = new Date(Date.UTC(p.y, p.mo - 1, p.d + k, 12));
    const dd = { dow: base.getUTCDay(), y: base.getUTCFullYear(), mo: base.getUTCMonth() + 1, d: base.getUTCDate() };
    const tt = day(dd.dow); if (!tt) continue;
    const at = stZoned(dd.y, dd.mo, dd.d, +tt[0].slice(0, 2), +tt[0].slice(3, 5), tz);
    if (at > now) return { open: false, closesAt: null, nextOpen: at };
  }
  return { open: false, closesAt: null, nextOpen: null };
}
const whenLabel = (d, tz, now) => { now = now || new Date(); tz = tz || 'America/Chicago'; const a = stTz(d, tz), b = stTz(now, tz); const same = a.y === b.y && a.mo === b.mo && a.d === b.d; const tom = stTz(new Date(now.getTime() + 864e5), tz); const isTom = a.y === tom.y && a.mo === tom.mo && a.d === tom.d; return (same ? '' : isTom ? 'tomorrow ' : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][a.dow] + ' ') + stClock(d, tz); };
